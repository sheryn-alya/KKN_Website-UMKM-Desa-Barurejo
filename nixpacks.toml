[phases.setup]
nixPkgs = ["php82", "composer", "php82.extensions.gd", "php82.extensions.mysqli", "php82.extensions.pdo_mysql", "freetype", "libpng", "libjpeg"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT}"
